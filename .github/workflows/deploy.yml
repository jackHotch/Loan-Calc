name: Deploy

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/loan-tracker
            git fetch origin production
            git reset --hard origin/production

            cd server
            npm ci
            npm run build

            cd ../client
            npm ci
            npm run build

            pm2 reload loan-tracker --update-env
